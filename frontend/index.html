<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<title>Sales Inventory</title>

<style>

@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap");

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Georgia, serif;

    background:linear-gradient(180deg,#0b1220 0%,#1c2740 45%,#2e1f14 100%);

}

.loader{

    text-align:center;

}

.spinner{

    width:48px;

    height:48px;

    border:5px solid rgba(211,166,37,.25);

    border-top:5px solid #D3A625;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:auto;

}

@keyframes spin{

from{transform:rotate(0deg);}
to{transform:rotate(360deg);}

}

p{

margin-top:20px;

color:#F0C75E;

font-family:"Cinzel", Georgia, serif;

letter-spacing:1px;

}

</style>

</head>

<body>

<div class="loader">

    <div class="spinner"></div>

    <p>Loading...</p>

</div>

<script>

const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

if(!token || !user){

    location.href="pages/login.html";

}else{

    if(user.role==="admin"){

        location.href="pages/dashboard/dashboard.html";

    }else if(user.role==="cashier"){

        location.href="pages/sale/sale.html";

    }else{

        localStorage.clear();

        location.href="pages/login.html";

    }

}

</script>

</body>

</html>
